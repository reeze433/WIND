name: Check and release WIND
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify
      - run: python build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: wind-package
          path: releases/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wind-package
          path: releases
      - name: Verify tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: python -c 'import json,os; v=json.load(open("releases/system.json"))["version"]; assert os.environ["TAG"]=="v"+v'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" releases/* --title "WIND $TAG" --generate-notes
